<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 로켓재고</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e5e7eb; --acc:#2563eb; --bad:#dc2626; --warn:#d97706; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:13px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  h2 { margin:0; font-size:18px; }
  .mute { color:var(--mute); font-size:12px; }
  .top { display:grid; grid-template-columns:minmax(260px,1fr) 2fr; gap:12px; margin:12px 0; }
  @media (max-width:800px) { .top { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tabs button { border:0; background:none; padding:2px 6px; color:var(--mute); cursor:pointer; font:inherit; }
  .tabs button.on { color:var(--acc); font-weight:700; border-bottom:2px solid var(--acc); }
  .big { font-size:24px; font-weight:700; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .acts { display:flex; flex-wrap:wrap; }
  .acts button { flex:1; min-width:90px; border:0; border-left:1px solid var(--line); background:none; padding:4px 8px; text-align:left; cursor:pointer; font:inherit; color:var(--mute); }
  .acts button:first-child { border-left:0; }
  .acts button b { display:block; font-size:22px; color:var(--ink); }
  .acts button.on { background:#eef2ff; border-radius:6px; }
  .acts button.red b { color:var(--bad); }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .bar select, .bar input[type=search] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .bar input[type=search] { min-width:200px; flex:1; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .row { display:grid; grid-template-columns:minmax(260px,2.2fr) minmax(170px,1.3fr) minmax(150px,1fr) minmax(120px,.9fr) minmax(120px,.9fr) 90px; gap:10px; padding:12px 14px; border-top:1px solid var(--line); align-items:start; }
  .row.head { border-top:0; color:var(--mute); font-size:12px; padding:8px 14px; background:#fafafa; border-radius:10px 10px 0 0; }
  @media (max-width:900px) { .row { grid-template-columns:1fr 1fr; } .row.head { display:none; } }
  .prod { display:flex; gap:10px; }
  .prod img { width:56px; height:56px; border-radius:6px; border:1px solid var(--line); object-fit:cover; background:#fafafa; flex:none; }
  .prod .nm { font-weight:600; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:#f3f4f6; color:var(--mute); margin:2px 4px 0 0; }
  .tag.used { background:#fff7ed; color:#c2410c; }
  .kv { display:grid; grid-template-columns:auto 1fr auto; gap:0 8px; font-variant-numeric:tabular-nums; }
  .kv span:nth-child(3n+2), .kv span:nth-child(3n) { text-align:right; }
  .kv .l { color:var(--mute); }
  .n { font-variant-numeric:tabular-nums; }
  .stock b { font-size:16px; }
  .days { display:inline-block; font-size:11px; padding:0 6px; border-radius:10px; background:#f3f4f6; margin-left:4px; }
  .days.low { background:#fee2e2; color:var(--bad); }
  .st { font-weight:600; }
  .st.품절 { color:var(--bad); } .st.품절임박 { color:var(--warn); } .st.과잉재고 { color:#7c3aed; } .st.양호 { color:var(--ok); }
  .neg { color:var(--bad); }
  .empty { padding:30px; text-align:center; color:var(--mute); }
  #inbBtn { padding:6px 12px; border:1px solid var(--acc); border-radius:6px; background:#fff; color:var(--acc); font:inherit; font-weight:600; cursor:pointer; }
  #inbBtn.on { background:var(--acc); color:#fff; }
  .ig { padding:12px 14px; border-top:1px solid var(--line); }
  .ig h3 { margin:0 0 6px; font-size:14px; }
  .ir { display:grid; grid-template-columns:minmax(220px,2fr) 1fr 90px; gap:8px; padding:4px 0; align-items:center; border-bottom:1px dashed var(--line); }
  .ir input { width:80px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; text-align:right; }
  .dts { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .dts button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 8px; font:inherit; cursor:pointer; }
  .dts button.ok { border-color:var(--ok); } .dts button.mon { border-color:var(--warn); color:var(--warn); }
  .dts button.pick { background:var(--acc); color:#fff; border-color:var(--acc); }
  .dts button:disabled { color:#bbb; cursor:default; text-decoration:line-through; }
  .ment { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; }
  .ig .btns button { margin:4px 6px 0 0; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<h2>재고현황 <span class="mute">쿠팡 로켓그로스 · 그래니살라·베이스튠·해트케 · 4개 계정</span></h2>
<div class="mute" id="meta">불러오는 중…</div>

<div class="top">
  <div class="card">
    <div class="tabs" id="ptabs"></div>
    <div class="mute">매출금액(취소 제외)</div>
    <div class="big" id="gmv">-</div>
    <div class="mute" id="units"></div>
  </div>
  <div class="card">
    <b>조치가 필요한 항목</b> <span class="mute">누르면 해당 상품만 보기</span>
    <div class="acts" id="acts" style="margin-top:8px"></div>
  </div>
</div>

<div class="bar">
  <select id="fBrand" onchange="render()"></select>
  <select id="fAcct" onchange="render()"></select>
  <input type="search" id="fq" placeholder="상품명·옵션·vendorItemId 검색" oninput="render()">
  <select id="fSort" onchange="render()">
    <option value="g30">지난 30일 매출 높은 순</option>
    <option value="g7">지난 7일 매출 높은 순</option>
    <option value="g1">어제 매출 높은 순</option>
    <option value="days">판매가능 예상일 짧은 순</option>
    <option value="qty">판매가능 수량 적은 순</option>
  </select>
  <label class="mute"><input type="checkbox" id="fNew" checked onchange="render()"> 새상품만(반품 재판매 제외)</label>
  <button id="inbBtn" onclick="inbMode=!inbMode;render()">🚚 입고 제안</button>
</div>

<div class="list" id="list"></div>
<p class="mute">값은 PC가 쿠팡 윙 재고현황 데이터로 받아 올립니다(쿠키가 만료된 계정은 공식 API로 대신 — 그 계정은 7일·매출 일부가 비어 보임).
  판매량은 취소를 뺀 수량, 매출은 취소 제외 금액입니다. 예상일수 = 쿠팡이 계산한 판매가능 예상 기간.</p>

<script>
const $ = id => document.getElementById(id);
const fmt = v => v === null || v === undefined ? '-' : Number(v).toLocaleString();
const GRADE = { NEW:'새상품', PACKAGE_DAMAGED:'포장 훼손', RETURN_BEST:'반품-최상', RETURN_GOOD:'반품-상', RETURN_NORMAL:'반품-중' };
let rows = [], period = '어제', act = '', HIST = [], OPEN = {};
const LEAD = 10;   // 입고 리드타임(일) — 날짜 조회 전 기본값
const avg = r => { const a7 = (r['7일'] || {})['수량'], a30 = (r['30일'] || {})['수량']; return a7 != null ? a7 / 7 : a30 != null ? a30 / 30 : 0; };
const runout = r => { const a = avg(r); return a > 0 && r['판매가능'] > 0 ? r['판매가능'] / a : null; };   // 남은 일수(최근 판매 속도)
const conv = (r, p) => { const x = r[p] || {}; return x['조회'] > 0 && x['수량'] != null ? x['수량'] / x['조회'] * 100 : null; };
const netp = r => r['가격'] ? r['가격'] - (r['즉시할인'] || 0) : null;
function derive(prev) {   // 어제 급감 + 원인(품절·아이템위너·가격변동), 전일 스냅샷과 가격 비교
  const P = {}; (prev || []).forEach(r => P[r.vendorItemId] = r);
  rows.forEach(r => {
    const a = avg(r), y = (r['어제'] || {})['수량'], o = P[r.vendorItemId];
    r._pc = o && netp(o) && netp(r) && netp(o) !== netp(r) ? [netp(o), netp(r)] : null;
    r._drop = a >= 1 && y != null && y < a * 0.5 ? (r['판매가능'] === 0 || r['상태'] === '품절' ? '품절' : r['아이템위너'] === false ? '아이템위너 아님'
      : r._pc ? `가격변동 ${fmt(r._pc[0])}→${fmt(r._pc[1])}` : '원인 미상') : '';
  });
}

async function load() {
  let c = {}; try { c = JSON.parse(localStorage.getItem('rt_db') || '{}'); } catch (e) {}
  if (!c.url) { $('meta').textContent = '위쪽 ⚙ 공유저장 설정을 먼저 해 주세요.'; return; }
  try {
    const r = await fetch(c.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token:c.token, action:'get', brand:'쿠팡', from: new Date(Date.now() - 31 * 864e5).toISOString().slice(0, 10) }) });
    const j = await r.json(); if (j.error) throw new Error(j.error);
    HIST = j.rows.filter(x => x.kind === 'rocket' && x.value).sort((a, b) => a.date < b.date ? -1 : 1);   // 날짜 오름차순(하루 1개)
    const last = HIST[HIST.length - 1];
    if (!last) { $('meta').textContent = '최근 30일 재고 기록이 없습니다.'; return; }
    rows = last.value.rows;
    derive((HIST[HIST.length - 2] || {}).value?.rows);
    const src = last.value.source || {};
    $('meta').textContent = `${last.value.generated} 기준 · 어제=${last.value.yday || ''} · ` +
      Object.entries(src).map(([a, s]) => `${a}:${s}`).join(' · ');
    const opt = (id, all, vals) => { $(id).innerHTML = `<option value="">${all}</option>` + vals.map(v => `<option>${v}</option>`).join(''); };
    opt('fBrand', '전체 브랜드', [...new Set(rows.map(r => r['브랜드']))]);
    opt('fAcct', '전체 계정', [...new Set(rows.map(r => r['계정']))]);
    render();
  } catch (e) { $('meta').textContent = '불러오기 실패 — ' + e.message; }
}

function base() {   // 브랜드·계정·검색·새상품 필터(조치 항목 숫자도 이 범위로 셈)
  const b = $('fBrand').value, a = $('fAcct').value, q = $('fq').value.trim().toLowerCase(), onlyNew = $('fNew').checked;
  return rows.filter(r => (!b || r['브랜드'] === b) && (!a || r['계정'] === a) && (!onlyNew || (r['등급'] || 'NEW') === 'NEW') &&
    (!q || (r['상품'] + ' ' + (r['옵션'] || '') + ' ' + r['vendorItemId']).toLowerCase().includes(q)));
}

const ACTS = [
  ['품절', r => r['상태'] === '품절', true],
  ['품절 임박', r => r['상태'] === '품절임박', true],
  [`${LEAD}일 안 품절 예상`, r => runout(r) !== null && runout(r) < LEAD, true],
  ['어제 판매 급감', r => !!r._drop, true],
  ['아이템위너 아님', r => r['아이템위너'] === false && ((r['30일'] || {})['매출'] || 0) > 0, true],
  ['예상 14일 미만', r => r['판매가능'] > 0 && r['예상일수'] > 0 && r['예상일수'] < 14, false],
  ['과잉 재고', r => r['상태'] === '과잉재고', false],
  ['입고중', r => (r['입고중'] || 0) > 0, false],
];

function render() {
  const B = base();
  // 기간 탭 + 매출 합계
  $('ptabs').innerHTML = ['어제', '7일', '30일'].map(p => `<button class="${p === period ? 'on' : ''}" onclick="period='${p}';render()">${p === '어제' ? '어제' : '지난 ' + p}</button>`).join('');
  const sum = k => B.reduce((s, r) => s + ((r[period] || {})[k] || 0), 0);
  $('gmv').textContent = fmt(sum('매출')) + '원';
  $('units').textContent = `판매 ${fmt(sum('수량'))}개 · 취소 ${fmt(sum('취소'))}개 · 조회 ${fmt(sum('조회'))}`;
  // 조치 항목
  $('acts').innerHTML = ACTS.map(([n, f, red]) => { const c = B.filter(f).length;
    return `<button class="${act === n ? 'on' : ''} ${red && c ? 'red' : ''}" onclick="act=act==='${n}'?'':'${n}';render()">${n}<b>${c}</b></button>`; }).join('');
  $('inbBtn').classList.toggle('on', inbMode);
  if (inbMode) return renderInb(act ? B.filter(ACTS.find(x => x[0] === act)[1]) : B);
  // 목록
  let L = act ? B.filter(ACTS.find(x => x[0] === act)[1]) : B;
  const g = (r, p) => (r[p] || {})['매출'] || 0;
  const S = { g30: (a, b) => g(b, '30일') - g(a, '30일'), g7: (a, b) => g(b, '7일') - g(a, '7일'), g1: (a, b) => g(b, '어제') - g(a, '어제'),
    days: (a, b) => (a['예상일수'] ?? 1e9) - (b['예상일수'] ?? 1e9), qty: (a, b) => (a['판매가능'] ?? 1e9) - (b['판매가능'] ?? 1e9) };
  L = [...L].sort(S[$('fSort').value]);
  const sale = (r, p, lab) => { const x = r[p]; return `<span class="l">${lab}</span><span class="${x && x['수량'] < 0 ? 'neg' : ''}">${x ? fmt(x['수량']) + '개' : '-'}</span><span>${x && x['매출'] !== null ? fmt(x['매출']) + '원' : '-'}</span>`; };
  const pct = v => v == null ? '-' : v.toFixed(1) + '%';
  $('list').innerHTML = `<div class="row head"><div>상품정보</div><div>최근 판매수량·매출</div><div>재고상태(개)</div><div>가격(원)</div><div>입고·반품</div><div>상품 상태</div></div>` +
    (L.length ? L.map(r => `<div class="row" style="cursor:pointer" onclick="OPEN['${r.vendorItemId}']=!OPEN['${r.vendorItemId}'];render()" title="누르면 최근 30일 기록">
      <div class="prod">${r['이미지'] ? `<img src="${r['이미지']}" alt="" loading="lazy">` : '<img alt="">'}
        <div><div class="nm">${r['상품']}, ${r['옵션'] || ''}</div>
          <div class="mute">${r['계정']} · ${r['vendorItemId']}</div>
          <span class="tag">${r['브랜드']}</span>${(r['등급'] || 'NEW') !== 'NEW' ? `<span class="tag used">${GRADE[r['등급']] || r['등급']}</span>` : ''}${r['승인상태'] ? `<span class="tag">${r['승인상태']}</span>` : ''}${r['판매중지'] ? '<span class="tag used">판매중지</span>' : ''}${r._drop ? `<span class="tag used">⚠ 어제 급감 · ${r._drop}</span>` : ''}${runout(r) !== null && runout(r) < LEAD ? `<span class="tag used">⚠ 약 ${Math.floor(runout(r))}일 뒤 품절</span>` : ''}
        </div></div>
      <div class="kv">${sale(r, '어제', '어제')}${sale(r, '7일', '지난 7일')}${sale(r, '30일', '지난 30일')}<span class="l">조회→판매</span><span>7일 ${pct(conv(r, '7일'))}</span><span>30일 ${pct(conv(r, '30일'))}</span></div>
      <div class="stock">판매가능 <b>${fmt(r['판매가능'])}</b>${r['예상일수'] ? `<span class="days ${r['예상일수'] < 14 ? 'low' : ''}">${r['예상일수']}일</span>` : ''}
        <div class="mute">입고중 ${fmt(r['입고중'])}</div></div>
      <div class="n">${r['가격'] ? fmt(r['가격'] - (r['즉시할인'] || 0)) : '-'}${r['즉시할인'] ? `<div class="mute">판매가 ${fmt(r['가격'])} · 즉시할인 ${fmt(r['즉시할인'])}</div>` : ''}
        <div class="mute">${r['아이템위너'] === true ? '아이템위너' : r['아이템위너'] === false ? '아이템위너 아님' : ''}</div></div>
      <div class="n mute">${r['추천입고'] ? `추천 입고 ${fmt(r['추천입고'])}개${r['추천입고일'] > 0 ? ` (${r['추천입고일']}일 내)` : ''}<br>` : ''}반품(30일) ${fmt(r['반품30일'])}${r['보관료'] ? `<br>보관료 ${fmt(r['보관료'])}원` : ''}</div>
      <div class="st ${r['상태']}">${r['상태']}</div>
    </div>${OPEN[r.vendorItemId] ? hist(r) : ''}`).join('') : '<div class="empty">조건에 맞는 상품이 없습니다.</div>');
}
function hist(r) {   // 최근 30일 스냅샷: 날짜별 판매가능·어제 판매·7일 전환율·가격
  const H = HIST.map(h => [h.value.yday || h.date, (h.value.rows || []).find(x => x.vendorItemId === r.vendorItemId)]).filter(x => x[1]);
  if (H.length < 2) return '<div class="ig mute">기록이 쌓이는 중입니다(하루 1개씩, 최근 30일).</div>';
  const mx = Math.max(1, ...H.map(([, x]) => x['판매가능'] || 0));
  return `<div class="ig"><table class="mute" style="border-collapse:collapse;font-size:12px"><tr><th align="left">날짜(어제)</th><th>판매가능</th><th></th><th>어제 판매</th><th>7일 전환</th><th>가격</th></tr>` +
    H.slice().reverse().map(([d, x]) => `<tr><td>${d}</td><td align="right">${fmt(x['판매가능'])}</td>
      <td><div style="width:${Math.round((x['판매가능'] || 0) / mx * 120)}px;height:6px;background:#93c5fd;border-radius:3px"></div></td>
      <td align="right">${fmt((x['어제'] || {})['수량'])}개</td><td align="right">${conv(x, '7일') == null ? '-' : conv(x, '7일').toFixed(1) + '%'}</td>
      <td align="right">${fmt(netp(x))}</td></tr>`).join('') + '</table></div>';
}
// ── 🚚 입고 제안 (2026-10-26): 30일 판매분 기준 수량 제안 → 계정별 한 입고 → 수량별 출고 가능일(이 PC 수집 서버) → 물류팀 멘트 ──
//   제안 = max(30일 판매, 7일 판매÷7×30) − 판매가능 − 입고중 (0 미만은 0). 칸에서 고칠 수 있음.
//   출고일 = 우리 창고에 쿠팡 차가 오는 날(밀크런 픽업일 = 센터 도착일과 같은 날). 주말·공휴일은 출고 안 함, 월요일은 가급적 피함.
let inbMode = false, inbAll = false;
const Q = {}, DT = {}, PICK = {};
const SRV = 'http://127.0.0.1:8765';
const sugg = r => { const s30 = (r['30일'] || {})['수량'] || 0, s7 = (r['7일'] || {})['수량'] || 0;
  return Math.max(0, Math.round(Math.max(s30, s7 / 7 * 30) - (r['판매가능'] || 0) - (r['입고중'] || 0))); };
const qty = r => Q[r.vendorItemId] ?? sugg(r);
const short = r => (r['상품'] || '').replace(/\[[^\]]*\]/g, '').replace(/[A-Za-z®][A-Za-z0-9 .'&®\-]*/g, ' ')   // 괄호·영문 빼고
  .replace(/해트케|베이스튠|그래니\s?살라/g, ' ').trim().split(/\s+/).slice(0, 3).join(' ');                            // 브랜드 빼고 앞 3단어
const md = d => (+d.slice(5, 7)) + '/' + (+d.slice(8));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function firstDay(acc) {   // 조회한 날짜 중 가장 빠른 가능일까지 남은 일수(조회 전엔 LEAD)
  const x = DT[acc] && DT[acc].dates && DT[acc].dates.find(x => x.fc && x.kind !== 'off');
  return x ? Math.max(0, Math.round((new Date(x.date + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5)) : LEAD;
}
const optN = r => parseFloat(((r['옵션'] || '').match(/\d+(\.\d+)?/) || ['Infinity'])[0]);   // 옵션의 첫 숫자(1개·3개·4.5kg)
function inbRows(B, acc) {   // 같은 상품끼리 모아 옵션 숫자 작은 순(2026-10-29)
  const L = B.filter(r => r['계정'] === acc && (inbAll || qty(r) > 0 || sugg(r) > 0)), first = {};
  L.forEach((r, i) => { if (!(r['상품'] in first)) first[r['상품']] = i; });
  return L.sort((a, b) => first[a['상품']] - first[b['상품']] || optN(a) - optN(b));
}
function renderInb(B) {
  const accs = [...new Set(B.map(r => r['계정']))];
  $('list').innerHTML = `<div class="ig"><b>입고 제안</b> <span class="mute">계정마다 한 입고(같은 상품은 옵션이 달라도 같이). 수량을 고친 뒤 [날짜 조회]를 누르세요.</span>
    <label class="mute" style="float:right"><input type="checkbox" ${inbAll ? 'checked' : ''} onchange="inbAll=this.checked;render()"> 제안 0개 상품도 보기</label></div>` +
    (accs.map(acc => {
      const L = inbRows(B, acc); if (!L.length) return '';
      const d = DT[acc], p = PICK[acc];
      const dates = !d ? '' : d.error ? `<div class="neg">${esc(d.error)}</div>` :
        `<div class="mute">밀크런 ${esc(d.type || '')} · 날짜를 누르면 아래 멘트에 들어가요 (줄 그은 날 = 쿠팡 입고 불가 / 회색 = 주말·공휴일)</div><div class="dts">` +
        d.dates.filter(x => x.kind !== 'off').map(x => `<button class="${x.fc ? x.kind : ''} ${p && p.date === x.date ? 'pick' : ''}" ${x.fc ? '' : 'disabled'}
          onclick="PICK['${acc}']=${esc(JSON.stringify(x))};render()">${md(x.date)}${x.kind === 'mon' ? '(월·가급적X)' : ''}${x.fc ? ' · ' + esc(x.fcName) : ''}</button>`).join('') + '</div>';
      return `<div class="ig"><h3>${esc(acc)} <span class="mute">${L.length}개 옵션 · 합계 ${fmt(L.reduce((s, r) => s + qty(r), 0))}개</span></h3>
        ${L.map(r => `<div class="ir"><div>${esc(r['브랜드'])} / ${esc(short(r))} / ${esc(r['옵션'] || '')}</div>
          <div class="mute">30일 ${fmt((r['30일'] || {})['수량'])} · 7일 ${fmt((r['7일'] || {})['수량'])} · 판매가능 ${fmt(r['판매가능'])} · 입고중 ${fmt(r['입고중'])} → 제안 ${fmt(sugg(r))}${(() => {
            const ro = runout(r), lead = firstDay(acc); return ro !== null && ro < lead ? `<div class="neg">⚠ 약 ${Math.floor(ro)}일 뒤 품절 — 가장 빠른 입고(${lead}일 뒤)보다 먼저 떨어짐</div>` : ''; })()}</div>
          <div><input type="number" min="0" value="${qty(r)}" onchange="Q['${r.vendorItemId}']=+this.value;delete DT['${acc}'];delete PICK['${acc}'];render()"></div></div>`).join('')}
        <div class="btns"><button onclick="inbDates('${acc}')">📅 날짜 조회</button></div>${dates}${inbMent(acc, L, p)}</div>`;
    }).join('') || '<div class="empty">입고가 필요한 상품이 없습니다.</div>');
}
async function inbDates(acc) {
  const L = inbRows(base(), acc).filter(r => qty(r) > 0);
  if (!L.length) { alert('수량이 0입니다.'); return; }
  DT[acc] = { dates: [], type: '조회 중… (10~30초)' }; delete PICK[acc]; render();
  try {
    const items = JSON.stringify(L.map(r => ({ v: r.vendorItemId, p: r.sellerProductId, q: qty(r) })));
    let j;
    try { j = await (await fetch(`${SRV}/collect?medium=${encodeURIComponent('쿠팡입고날짜')}&acc=${encodeURIComponent(acc)}&items=${encodeURIComponent(items)}`)).json(); }
    catch (e) { j = await inbLan(acc, items); }   // 이 PC가 아니면: 같은 와이파이의 수집 PC(입고날짜서버.py)에 맡김
    DT[acc] = j.error ? { error: j.error } : j;
  } catch (e) { DT[acc] = { error: '날짜 조회 실패 — 수집 PC(같은 와이파이)가 켜져 있는지 확인하세요. 수량 제안·멘트는 어디서나 됩니다. (' + e.message + ')' }; }
  render();
}
async function inbLan(acc, items) {     // 수집 PC 주소는 비공개 시트(설정/2000-01-05/lan)에 그 PC가 올려 둠
  const c = JSON.parse(localStorage.getItem('rt_db') || '{}');
  const r = await (await fetch(c.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ token:c.token, action:'get', brand:'설정', from:'2000-01-05', to:'2000-01-05' }) })).json();
  const lan = ((r.rows || []).find(x => x.kind === 'lan') || {}).value;
  if (!lan || !lan.url) throw new Error('수집 PC 주소 없음');
  return (await fetch(`${lan.url}/dates?acc=${encodeURIComponent(acc)}&items=${encodeURIComponent(items)}`, { headers: { 'x-cheda-token': c.token } })).json();
}
// ★2026-10-29 물류팀 양식: 제품명 / 개입수량 / 세트수량 / 개별수량. 개입 = 옵션의 'N개·N박스·N세트·N팩·N입'(없으면 1)
const PACK = /(\d+)\s*(개입|개|박스|세트|팩|입)/;
const packN = r => +(((r['옵션'] || '').match(PACK) || [0, 1])[1]);
function pname(r) {   // 브랜드 + 짧은 상품명 + 옵션(개입 표시·이미 나온 단어 빼고)
  const head = `${r['브랜드']} ${short(r)}`, seen = new Set(head.split(/\s+/));
  const opt = (r['옵션'] || '').replace(PACK, ' ').split(/\s+/).filter(w => w && !seen.has(w));
  return [head, ...opt].join(' ');
}
function inbCols(L) { return L.filter(r => qty(r) > 0).map(r => [pname(r), packN(r) + '개입', qty(r) + '세트', qty(r) * packN(r) + 'EA']); }
function inbMent(acc, L, p) {
  const t = `[쿠팡_로켓그로스 요청]\n\n안녕하세요 승로님\n밀크런 입고 확인 요청드립니다.\n가능 여부 확인 부탁드리며,\n작업지시서 부탁드립니다!\n\n\n` +
    `출고일 : ${p ? md(p.date) : '(날짜 조회 후 선택)'}\n센터 : ${p ? p.fcName : '(날짜 조회 후 선택)'}\n제품/수량\n제품명 / 개입수량 / 세트수량 / 개별수량\n` +
    inbCols(L).map(c => c.join(' / ')).join('\n') +
    `\n\n\n\n\n\n상기 양식으로 통일 기재 부탁드리며, 내용 수정이 있을경우(제품,수량 등) 출고일 기준 2일 전까지는 수정 및 확정지어주시기 바랍니다.. !`;
  const qt = inbCols(L).map(c => c.join('\t')).join('\n');
  window['_m_' + acc] = t; window['_q_' + acc] = qt;
  return `<div class="ment">${esc(t)}</div><div class="btns"><button onclick="navigator.clipboard.writeText(window['_m_${acc}']);this.textContent='✅ 복사됨'">📋 멘트 복사</button>
    <button onclick="navigator.clipboard.writeText(window['_q_${acc}']);this.textContent='✅ 복사됨'">🔢 수량만 복사(엑셀용)</button></div>`;
}
load();
</script>
